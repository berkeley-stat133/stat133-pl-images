name: Build and push Quiz 3 RStudio workspace image

# Builds rstudio-quiz3/Dockerfile on a GitHub-hosted runner and pushes it to
# GHCR. Exists so nobody needs a local Docker install (e.g. an OS too old
# for Docker Desktop) to publish this image.
#
# This repo (stat133-pl-images) is public and owned by the berkeley-stat133
# org, so the workflow's own built-in GITHUB_TOKEN is enough to publish to
# ghcr.io/berkeley-stat133/... -- no PAT or repo secrets required.
#
# IMPORTANT: the package name (stat133-pl-images-rstudio-quiz3) is unique to
# this repo on purpose. GHCR packages are owned by whichever specific repo
# first creates them, not shared automatically across a GitHub org -- an
# earlier attempt to publish under a name already created by a different
# repo (fall-2026-private) failed with "permission_denied: write_package"
# even though both repos are in the same org. Publishing under a fresh name
# avoids that entirely.
#
# If this ever fails with a permissions error, check Settings > Actions >
# General > Workflow permissions on this repo and make sure "Read and write
# permissions" is selected (this grants GITHUB_TOKEN packages:write, on top
# of the `permissions:` block below).
#
# After the first successful run, go to
# github.com/orgs/berkeley-stat133/packages, find
# stat133-pl-images-rstudio-quiz3, and set its visibility to Public (the
# PrairieLearn workspace host must pull it without credentials, and this is
# independent of this repo's own public visibility).
#
# Trigger manually from the Actions tab, or automatically on changes to the
# image's build context.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rstudio-quiz3/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/berkeley-stat133/stat133-pl-images-rstudio-quiz3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Guardrail: a malformed step here should fail fast, not silently burn
    # runner minutes for hours waiting on a hung process.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: rstudio-quiz3
          push: true
          load: true
          tags: |
            ${{ env.IMAGE }}:1.0
            ${{ env.IMAGE }}:latest

      # Runs on the GitHub-hosted runner, not on any contributor's laptop --
      # useful when nobody on staff has a local Docker install available.
      #
      # NOTE: keep this a real multi-line string (no trailing backslashes
      # inside the quotes). Backslash-newline inside single quotes is literal
      # in bash, not a continuation, so a stray `\` reaches R -- and R 4.1+
      # treats a bare `\` as the start of a `\(x) ...` lambda, leaving the
      # parse incomplete and the process hanging on stdin forever.
      - name: Smoke test (packages + data(zev) load correctly)
        run: |
          docker run --rm ${{ env.IMAGE }}:1.0 R -e '
            library(tidyverse)
            library(palmerpenguins)
            data(zev)
            data(penguins)
            stopifnot(nrow(zev) == 77898, ncol(zev) == 7)
            stopifnot(nrow(penguins) > 0)
            cat("OK: zev is", nrow(zev), "x", ncol(zev), "\n")
            str(zev)
            str(penguins)
          '
